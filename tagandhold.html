<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tag &amp; Hold — Horner Plumbing</title>
    <style>
        :root {
            --navy: #1B3A6B;
            --navy-light: #2a4f8f;
            --gold: #C5922A;
            --bg: #f4f4f4;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --border: #dddddd;
            --success: #2e7d32;
            --danger: #c62828;
            --cart-badge: #c62828;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Header ── */
        .header {
            background: var(--navy);
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .header-sub {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 2px;
        }
        .cart-btn {
            position: relative;
            background: var(--gold);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
        }
        .cart-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--cart-badge);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Job Input ── */
        .section {
            padding: 16px 20px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .job-input-row {
            display: flex;
            gap: 10px;
        }
        .job-input-row input {
            flex: 1;
            font-size: 18px;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--card-bg);
            text-transform: uppercase;
        }
        .job-input-row input:focus {
            outline: none;
            border-color: var(--navy);
        }
        .job-input-row button {
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
        }

        /* ── Phase Selector ── */
        .phase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
        }
        .phase-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            min-height: 44px;
            overflow: hidden;
        }
        .phase-card.active {
            border-color: var(--navy);
            background: #e8eef6;
        }
        .phase-card .phase-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--navy);
            line-height: 1.2;
        }
        .phase-card .phase-num-sm {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            margin-top: 4px;
        }
        .phase-card .phase-detail {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }

        /* ── Item List (order-sheet style) ── */
        .item-row {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }
        .item-row:last-child {
            border-bottom: none;
        }
        .item-info {
            flex: 1;
            min-width: 0;
        }
        .item-desc {
            font-size: 16px;
            font-weight: 500;
            color: var(--navy);
            line-height: 1.3;
        }
        .item-sub {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 3px;
        }
        .qty-input {
            width: 70px;
            font-size: 18px;
            padding: 8px 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
            background: var(--card-bg);
            flex-shrink: 0;
        }
        .qty-input:focus {
            outline: none;
            border-color: var(--navy);
        }
        .add-btn {
            background: var(--card-bg);
            color: var(--text-light);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            min-width: 44px;
            min-height: 44px;
            flex-shrink: 0;
        }
        .add-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .add-btn.added {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        /* ── Floating Buttons ── */
        .fab-cart {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--navy);
            color: white;
            border: none;
            cursor: pointer;
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        }
        .fab-cart svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
        .fab-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--cart-badge);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .fab-top {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--navy);
            color: white;
            border: none;
            cursor: pointer;
            z-index: 150;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .fab-top svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        /* ── Cart Panel ── */
        .cart-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
        }
        .cart-overlay.open { display: block; }
        .cart-panel {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: min(400px, 90vw);
            background: var(--bg);
            z-index: 201;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.25s ease;
        }
        .cart-overlay.open .cart-panel {
            transform: translateX(0);
        }
        .cart-header {
            background: var(--navy);
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cart-header h2 {
            font-size: 18px;
        }
        .cart-close {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 4px;
            min-width: 44px;
            min-height: 44px;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .cart-item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        .cart-item-desc {
            font-size: 14px;
            font-weight: 500;
            flex: 1;
        }
        .cart-item-qty {
            font-size: 16px;
            font-weight: 700;
            color: var(--navy);
            white-space: nowrap;
        }
        .cart-item-remove {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 20px;
            cursor: pointer;
            padding: 2px 6px;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }
        .submit-btn {
            width: 100%;
            background: var(--gold);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            min-height: 54px;
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            font-size: 15px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: var(--text-light);
        }

        .status-msg {
            padding: 12px 16px;
            border-radius: 10px;
            margin: 10px 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .status-msg.success { background: #e8f5e9; color: var(--success); }
        .status-msg.error { background: #fbe9e7; color: var(--danger); }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div>
        <h1>Tag &amp; Hold</h1>
        <div class="header-sub" id="headerJob"></div>
    </div>
    <button class="cart-btn" onclick="toggleCart()">
        Cart
        <span class="cart-badge" id="cartBadge" style="display:none">0</span>
    </button>
</div>

<!-- Job Input -->
<div class="section" id="jobSection">
    <div class="section-title">Job Number</div>
    <div class="job-input-row">
        <input type="text" id="jobInput" placeholder="e.g. CAT-25155" autocapitalize="characters" autocomplete="off">
        <button onclick="loadJob()">Go</button>
    </div>
</div>

<!-- Status Messages -->
<div id="statusArea"></div>

<!-- Phase Selector -->
<div class="section" id="phaseSection" style="display:none">
    <div class="section-title">Select Phase</div>
    <div class="phase-grid" id="phaseGrid"></div>
</div>

<!-- Item List -->
<div class="section" id="itemSection" style="display:none">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;"><div class="section-title" id="itemSectionTitle">Items</div><button id="releaseAllBtn" style="display:none; background:var(--gold); color:white; border:none; border-radius:8px; padding:8px 16px; font-size:14px; font-weight:600; cursor:pointer; min-height:44px;" onclick="releaseAll()">Release All</button></div>
    <div id="itemList"></div>
</div>

<!-- Floating Buttons -->
<button class="fab-cart" id="fabCart" onclick="toggleCart()" style="display:none">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM7.16 14.26l.04-.12.94-1.7h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0020.04 4H5.21l-.94-2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7.42c-.14 0-.25-.11-.25-.25z"/></svg>
    <span class="fab-badge" id="fabBadge">0</span>
</button>
<button class="fab-top" id="fabTop" onclick="scrollToTop()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
    TOP
</button>

<!-- Cart Overlay -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()">
    <div class="cart-panel" onclick="event.stopPropagation()">
        <div class="cart-header">
            <h2>Release Cart</h2>
            <button class="cart-close" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="empty-state">Cart is empty</div>
        </div>
        <div class="cart-footer">
            <button class="submit-btn" id="submitBtn" onclick="submitRelease()" disabled>
                Submit Release
            </button>
        </div>
    </div>
</div>

<script>
    // ── Config ──
    const API_BASE = '/api';

    // ── State ──
    let currentJob = '';
    let phases = [];
    let currentPhase = '';
    let items = [];
    let cart = []; // { poNo, lineNo, description, qty, vendorName, vendorCode, uom, qtyAvailable }

    // ── Job Loading ──
    const jobInput = document.getElementById('jobInput');
    jobInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loadJob();
    });

    async function loadJob() {
        const jobNo = jobInput.value.trim().toUpperCase();
        if (!jobNo) return;

        currentJob = jobNo;
        currentPhase = '';
        showStatus('');
        document.getElementById('phaseSection').style.display = 'none';
        document.getElementById('itemSection').style.display = 'none';
        document.getElementById('headerJob').textContent = jobNo;

        // Fetch job name + address for email payload
        window._jobInfo = null;
        try {
            const infoResp = await fetch(API_BASE + '/job/' + encodeURIComponent(jobNo) + '/info');
            if (infoResp.ok) window._jobInfo = await infoResp.json();
        } catch(e) {}


        try {
            const resp = await fetch(`${API_BASE}/job/${encodeURIComponent(jobNo)}/phases`);
            if (!resp.ok) throw new Error(`Job not found or no open items`);
            phases = await resp.json();

            if (phases.length === 0) {
                showStatus('No unreleased items found for this job.', 'error');
                return;
            }

            renderPhases();
            document.getElementById('phaseSection').style.display = '';
        } catch (err) {
            showStatus(err.message, 'error');
        }
    }

    // ── Phase Rendering ──
    function renderPhases() {
        const grid = document.getElementById('phaseGrid');
        grid.innerHTML = phases.map(p => `
            <div class="phase-card ${p.phase === currentPhase ? 'active' : ''}" 
                 onclick="selectPhase('${p.phase}')">
                <div class="phase-name">${p.phaseName || 'Phase ' + p.phase}</div>
                <div class="phase-num-sm">Phase ${p.phase}</div>
                <div class="phase-detail">${p.itemCount} item${p.itemCount !== 1 ? 's' : ''}</div>
            </div>
        `).join('');
    }

    async function selectPhase(phase) {
        currentPhase = phase;
        renderPhases();

        document.getElementById('itemSection').style.display = '';
        document.getElementById('itemSectionTitle').textContent = `Phase ${phase} Items`;
        document.getElementById('itemList').innerHTML = '<div class="loading">Loading items...</div>';

        try {
            const resp = await fetch(`${API_BASE}/job/${encodeURIComponent(currentJob)}/phase/${encodeURIComponent(phase)}/items`);
            if (!resp.ok) throw new Error('Failed to load items');
            items = await resp.json();
            renderItems();
        } catch (err) {
            document.getElementById('itemList').innerHTML = `<div class="empty-state">${err.message}</div>`;
        }
    }

    // ── Item Rendering ──
    function renderItems() {
        const list = document.getElementById('itemList');

        if (items.length === 0) {
            list.innerHTML = '<div class="empty-state">No unreleased items in this phase</div>';
            return;
        }

        document.getElementById("releaseAllBtn").style.display = items.length > 0 ? "" : "none";
        list.innerHTML = items.map((item, idx) => {
            const inCart = cart.find(c => c.poNo === item.poNo && c.lineNo === item.lineNo);
            return `
                <div class="item-row">
                    <div class="item-info">
                        <div class="item-desc">${escHtml(item.description)}</div>
                        <div class="item-sub">${escHtml(item.vendorName)} · Avail: ${item.qtyToReceive}</div>
                    </div>
                    <input type="number" class="qty-input" id="qty-${idx}" 
                           min="1" max="${item.qtyToReceive}" value="${inCart ? inCart.qty : ''}"
                           inputmode="numeric">
                    <button class="add-btn ${inCart ? 'added' : ''}" 
                            onclick="addToCart(${idx})"
                            ${inCart ? 'disabled' : ''}>
                        ${inCart ? '✓ Added' : 'Add to Cart'}
                    </button>
                </div>
            `;
        }).join('');
    }

    // ── Cart ──
    function addToCart(idx) {
        const item = items[idx];
        const qtyInput = document.getElementById(`qty-${idx}`);
        const qty = parseInt(qtyInput.value);

        if (isNaN(qty) || qty < 1 || qty > item.qtyToReceive) {
            showStatus(`Quantity must be between 1 and ${item.qtyToReceive}`, 'error');
            return;
        }

        // Remove existing entry for same line if re-adding
        cart = cart.filter(c => !(c.poNo === item.poNo && c.lineNo === item.lineNo));

        cart.push({
            poNo: item.poNo,
            lineNo: item.lineNo,
            description: item.description,
            qty: qty,
            vendorName: item.vendorName,
            vendorCode: item.vendorCode,
            uom: item.uom,
            qtyAvailable: item.qtyToReceive
        });

        updateCartBadge();
        renderItems();
        showStatus(`Added: ${item.description} (×${qty})`, 'success');
        setTimeout(() => showStatus(''), 2000);
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartBadge();
        renderCartItems();
        renderItems(); // refresh add buttons
    }

    function updateCartBadge() {
        const badge = document.getElementById('cartBadge');
        const fabBadge = document.getElementById('fabBadge');
        const btn = document.getElementById('submitBtn');
        if (cart.length > 0) {
            badge.style.display = 'flex';
            badge.textContent = cart.length;
            fabBadge.style.display = 'flex';
            fabBadge.textContent = cart.length;
            btn.disabled = false;
        } else {
            badge.style.display = 'none';
            fabBadge.style.display = 'none';
            btn.disabled = true;
        }
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleCart() {
        const overlay = document.getElementById('cartOverlay');
        overlay.classList.toggle('open');
        if (overlay.classList.contains('open')) {
            renderCartItems();
        }
    }

    function renderCartItems() {
        const container = document.getElementById('cartItems');
        if (cart.length === 0) {
            container.innerHTML = '<div class="empty-state">Cart is empty</div>';
            return;
        }

        container.innerHTML = cart.map((c, idx) => `
            <div class="cart-item">
                <div class="cart-item-desc">
                    ${escHtml(c.description)}
                    <div style="font-size:12px;color:var(--text-light);margin-top:4px">
                        ${escHtml(c.vendorName)}
                    </div>
                </div>
                <div class="cart-item-qty">×${c.qty}</div>
                <button class="cart-item-remove" onclick="removeFromCart(${idx})">✕</button>
            </div>
        `).join('');
    }

    // ── Submit ──
    // Power Automate flow URL — replace with actual trigger URL
    const FLOW_URL = 'https://defaultef466c747a134920854c210669ea3c.84.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/21/workflows/e6737c65744a415abfba656980a7ab32/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=gkhRfWw5o0hUnvqdEDglSWcsO7UXvMhP2ixsO6oyB_0';

    async function submitRelease() {
        if (cart.length === 0) return;

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        // Group cart items by vendor
        const vendorGroups = {};
        cart.forEach(c => {
            if (!vendorGroups[c.vendorName]) {
                vendorGroups[c.vendorName] = {
                    vendorName: c.vendorName,
                    vendorCode: c.vendorCode,
                    items: []
                };
            }
            vendorGroups[c.vendorName].items.push({
                poNo: c.poNo,
                lineNo: c.lineNo,
                description: c.description,
                qty: c.qty,
                uom: c.uom
            });
        });

        const releaseData = {
            jobNo: currentJob,
            jobName: window._jobInfo ? window._jobInfo.jobName : '',
            jobAddress: window._jobInfo ? (window._jobInfo.address + ', ' + window._jobInfo.city + ', ' + window._jobInfo.state + ' ' + window._jobInfo.zip).trim() : '',
            foreman: window._foreman || '',
            foremanPhone: window._foremanPhone || '',
            submittedBy: window._submittedBy || '',
            vendors: Object.values(vendorGroups),
            submittedAt: new Date().toISOString(),
            totalItems: cart.length
        };

        console.log('Release payload:', JSON.stringify(releaseData, null, 2));

        try {
            if (FLOW_URL === 'PASTE_FLOW_URL_HERE') {
                // Flow not wired up yet — simulate success
                await new Promise(r => setTimeout(r, 500));
            } else {
                const resp = await fetch(FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(releaseData)
                });
                if (!resp.ok) throw new Error('Flow returned ' + resp.status);
            }

            cart = [];
            updateCartBadge();
            toggleCart();
            showStatus('Release submitted! Aaron has been notified.', 'success');
        } catch (err) {
            showStatus('Submit failed: ' + err.message, 'error');
        }

        submitBtn.textContent = 'Submit Release';
        submitBtn.disabled = cart.length === 0;

        // Refresh items
        if (currentPhase) {
            await selectPhase(currentPhase);
        }
    }

    // ── Helpers ──
    function showStatus(msg, type) {
        const area = document.getElementById('statusArea');
        if (!msg) { area.innerHTML = ''; return; }
        area.innerHTML = `<div class="status-msg ${type || ''}">${msg}</div>`;
    }

    function releaseAll() {
        if (items.length === 0) return;
        items.forEach((item, idx) => {
            const inCart = cart.find(c => c.poNo === item.poNo && c.lineNo === item.lineNo);
            if (!inCart && item.qtyToReceive > 0) {
                cart.push({
                    poNo: item.poNo,
                    lineNo: item.lineNo,
                    description: item.description,
                    qty: item.qtyToReceive,
                    vendorName: item.vendorName,
                    vendorCode: item.vendorCode,
                    uom: item.uom,
                    qtyAvailable: item.qtyToReceive
                });
            }
        });
        updateCartBadge();
        renderItems();
        showStatus("All items added to cart", "success");
        setTimeout(() => showStatus(""), 2000);
    }

    function escHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    // ── Auto-load from URL param ──
    (function() {
        const params = new URLSearchParams(window.location.search);

        // Store foreman info from URL params
        window._foreman = params.get('foreman') || '';
        window._foremanPhone = params.get('foremanPhone') || '';
        window._submittedBy = params.get('submittedBy') || '';

   // Embedded mode — hide entire header, use floating cart FAB instead
        if (params.get('embedded') === '1') {
            document.getElementById('jobSection').style.display = 'none';
            document.querySelector('.header').style.display = 'none';
            document.getElementById('fabCart').style.display = 'flex';
            // Show TOP button on scroll
            window.addEventListener('scroll', function() {
                document.getElementById('fabTop').style.display = window.scrollY > 300 ? 'flex' : 'none';
            });
        }

                const jobFromUrl = params.get('job');
        if (jobFromUrl) {
            // Hide the manual search field
            document.getElementById('jobSection').style.display = 'none';
            // Set the job and load phases
            jobInput.value = jobFromUrl.toUpperCase();
            loadJob();
        }
    })();
</script>
</body>
</html>
