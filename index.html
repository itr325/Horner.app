// Hide floating action buttons when on-screen keyboard is open
(function() {
  var sel = "input,select,textarea";
  document.addEventListener("focusin", function(e) {
    if (e.target && e.target.matches && e.target.matches(sel)) {
      document.body.classList.add("kb-open");
    }
  });
  document.addEventListener("focusout", function() {
    setTimeout(function() {
      var a = document.activeElement;
      if (!a || !a.matches || !a.matches(sel)) {
        document.body.classList.remove("kb-open");
      }
    }, 50);
  });
  // iPad keyboard "down arrow" doesn't fire blur — watch viewport size instead
  if (window.visualViewport) {

    });

})();
